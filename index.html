<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="DeeperIA - CRM inteligente com IA para gestão de assistências técnicas de celular." />
    <title>DeeperIA - CRM + IA para Assistência Técnica de Celular</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DeeperIA" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link id="dynamic-favicon" rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <script>
      // Anti-flash: aplica o modo de cor salvo (ou preferência do sistema)
      // antes do primeiro paint — evita tela branca piscando no dark mode.
      (function () {
        try {
          var stored = localStorage.getItem('deeperia-mode');
          var mode = 'light';
          if (stored) {
            var parsed = JSON.parse(stored);
            mode = (parsed && parsed.state && parsed.state.mode) || 'light';
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            mode = 'dark';
          }
          document.documentElement.dataset.theme = mode;
        } catch (e) { /* modo padrão light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
